<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b1f2a;--muted:#5b6475;--border:#dde2ee;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#eef0f6;--muted:#a3adc0;--border:#2d3445;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#eef0f6;--muted:#a3adc0;--border:#2d3445;color-scheme:dark}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{text-align:center;padding:36px 16px 20px}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,36px)}
header p{margin:0;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;background:var(--a)}
nav a{opacity:.55}nav a.on{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 35%,transparent)}
section{display:none}section.on{display:block}
.c1{--a:#d9480f}.c2{--a:#0f766e}.c3{--a:#7c3aed}.c4{--a:#2563eb}
section{background:color-mix(in srgb,var(--a) 10%,var(--bg));border-top:6px solid var(--a);padding:28px 16px 36px}
.wrap{max-width:820px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.head h2{margin:0;font-size:22px;color:var(--a)}
.head small{display:block;color:var(--muted);font-size:14px}
button{font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--a);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
details{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--a);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"Q" counter(q);counter-increment:q;color:var(--a);margin-right:8px;font-weight:800}
.qs{counter-reset:q}
details[open] summary{border-bottom:1px dashed var(--border)}
.ans{padding:12px 14px;color:var(--text)}
.ans::before{content:"Jawaab: ";color:var(--a);font-weight:700}
code{background:color-mix(in srgb,var(--a) 14%,var(--card));padding:1px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:.92em}

.quiz{margin-top:30px;padding-top:20px;border-top:2px dashed var(--a)}
.quiz h3{margin:0;font-size:20px;color:var(--a)}
.mq{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.mq p{margin:0 0 6px}
.op{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;color:var(--text);font-weight:500;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px}
.op .ci{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--a);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--a)}
.op:hover{background:color-mix(in srgb,var(--a) 10%,var(--card))}
.mq.done .op{cursor:default}
.op.ok{background:color-mix(in srgb,#16a34a 18%,var(--card));border-color:#16a34a}
.op.ok .ci{background:#16a34a;border-color:#16a34a;color:#fff}
.op.no{background:color-mix(in srgb,#dc2626 16%,var(--card));border-color:#dc2626}
.op.no .ci{background:#dc2626;border-color:#dc2626;color:#fff}
footer{text-align:center;color:var(--muted);padding:20px;font-size:14px}

<script>
const D=[
{c:"c1",n:"Chapter 1",t:"Chapter 1: What is JavaScript?",s:"What it is, what it does, where it runs, your first script",qa:[
["What is JavaScript?","The programming language of the web browser. It is a real language (variables, decisions, loops, functions), built into every browser, made to read and change a web page and react to the user."],
["A web page is built from three languages. What does each one do?","<b>HTML</b> = structure (what is on the page); <b>CSS</b> = style (how it looks); <b>JavaScript</b> = behaviour (what the page does when the user clicks, types, scrolls or waits)."],
["What can JavaScript do that HTML and CSS cannot?","HTML and CSS only show what you typed. JavaScript can look at the world (the time, the user, the server) and change the page, e.g. a greeting that reads the clock every second and shows “Good morning” or “Good afternoon”."],
["What does “interpreted” mean, and what is a JavaScript engine?","Interpreted means there is no compile step: the code is read line by line, so you change a line, refresh and see the result. The engine is the part of the browser that runs JavaScript (V8 in Chrome)."],
["Who created JavaScript, when, and what was it first called?","Brendan Eich created it at Netscape in 1995 (in about 10 days). It was first called Mocha, then LiveScript."],
["What are ECMAScript and ES6?","ECMAScript (1997) is the official standard, so every browser runs the same language. ES6 (2015) is the modern version that added <code>let</code>, <code>const</code>, arrow functions and classes."],
["What is Node.js?","JavaScript running outside the browser, on servers (introduced in 2009)."],
["Why is it called “Java”Script?","In 1995 Java was the popular new language, so Netscape borrowed the name for marketing. That is the only connection."],
["Give four differences between Java and JavaScript.","Java is compiled before it runs; JavaScript is interpreted as it runs. Java runs on the JVM; JavaScript runs in the browser (and Node.js). Java is used for Android apps and banking back-ends; JavaScript for web pages and web apps. Java has strict types; JavaScript has flexible types."],
["How big is JavaScript?","About 99% of websites use JavaScript in the browser, and it has been the most-used programming language among developers every year since 2013."],
["Name four things JavaScript does on a page.","Reacts (events: click, keypress, scroll), Changes the DOM (new message, like count, image), Checks (validation, e.g. “Password too short”) and Talks (fetch/AJAX: loads new data in the background)."],
["Where does JavaScript run, and with which tools?","Browser/front-end (Vanilla JS, React, Vue), server/back-end (Node.js, Express), mobile phones (React Native) and desktop apps (Electron, e.g. VS Code, Slack, Figma)."],
["Which two free tools do you need to start?","A modern browser (Chrome, Edge or Firefox), which runs your code and gives you the Developer Tools and Console; and Visual Studio Code, with the Live Server extension that refreshes the page for you."],
["How do you open the Console?","F12 on Windows/Linux, <code>Ctrl + Shift + J</code> to open straight to the Console, and <code>Cmd + Option + J</code> on a Mac. It runs JavaScript immediately, shows red errors and prints anything passed to <code>console.log()</code>."],
["What are the three ways to put JavaScript in a page?","<b>Internal</b> (<code>&lt;script&gt;</code> inside the HTML): fine for learning. <b>External</b> (<code>&lt;script src=\"app.js\"&gt;</code>): best practice, organised and reusable. <b>Inline</b> (<code>onclick=\"...\"</code> in an attribute): avoid, because it mixes structure with behaviour."]
]},
{c:"c2",n:"Chapter 2",t:"Chapter 2: Variables, Data and Control Flow",s:"let / const, data types, if / else, switch, loops",qa:[
["What is a variable?","A labelled box: the label is the name, inside is the value. You use the name to get the value back later: <code>let studentName = \"Amina\";</code>"],
["What is the difference between let and const?","<code>let</code>: the value can change later (a score, a counter, a total). <code>const</code>: the value can never change (changing it gives a red error). Use <code>const</code> by default, <code>let</code> only when needed, and never the old <code>var</code>."],
["What are the rules for naming variables?","Use camelCase (<code>studentName</code>, <code>totalFee</code>) and meaningful names. No spaces, cannot start with a number, cannot be a reserved word like <code>let</code>. Names are case sensitive: <code>studentName</code>, <code>StudentName</code> and <code>studentname</code> are different."],
["What are the three basic data types? Why is “20” not 20?","String (text in quotes), Number (whole numbers and decimals, no quotes) and Boolean (<code>true</code> / <code>false</code>). With quotes it is text; without quotes it is a number you can do maths with."],
["List the arithmetic operators. How do you test if a number is even?","<code>+ - * / % **</code> (<code>%</code> is the remainder, <code>**</code> is power). <code>8 % 2</code> is 0, so it is even; <code>7 % 2</code> is 1, so it is odd. Short forms: <code>likes++</code>, <code>total += 5</code>."],
["How do you join text: + or template literals?","<code>\"Hi \" + name + \", welcome!\"</code> (old way) or <code>`Hi ${name}, welcome!`</code> (template literal, with backticks, the key under Esc). Both print <code>Hi Amina, welcome!</code>"],
["Why is <code>\"5\" + 5</code> equal to “55”, and how does prompt() relate to this?","<code>+</code> adds numbers or joins text; if either side is text, JavaScript joins. <code>prompt()</code> ALWAYS gives text, so wrap it in <code>Number()</code> before doing maths: <code>Number(\"5\") + 5</code> is 10."],
["Name the comparison operators. What is the difference between =, == and ===?","<code>===</code>, <code>!==</code>, <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>. <code>=</code> puts a value INTO a box; <code>==</code> is old and loose (avoid); <code>===</code> checks value AND type (use it)."],
["Explain if … else.","Two roads, only one is taken: <code>if (score &gt;= 50) { ... } else { ... }</code>. If the condition is true the if block runs, otherwise the else block runs."],
["What do &&, || and ! mean?","<code>&&</code> (and): both must be true. <code>||</code> (or): at least one is true. <code>!</code> (not): flips true and false. In a login check, only username AND password both right gives “Welcome”."],
["How does an else if grade calculator work? How do you check the input?","Conditions are checked top to bottom and the first true one wins (80+ → A, 70+ → B, 60+ → C, 50+ → D, else F). Check the input FIRST: <code>isNaN(score) || score &lt; 0 || score &gt; 100</code> → “Not a valid score”. <code>Number(\"abc\")</code> gives <code>NaN</code> (Not a Number)."],
["When do you use switch? What do case, break and default do?","<code>switch</code> is for one value with many exact choices (days, menu). <code>case</code> is each possible value; <code>break</code> stops (without it the next case also runs); <code>default</code> runs when nothing matches, like else. Use <code>if</code> for ranges."],
["Explain the three parts of a for loop.","<code>for (let i = 1; i &lt;= 3; i++)</code>: Start (<code>let i = 1</code>, runs once), Condition (<code>i &lt;= 3</code>, checked before each round; false ends the loop) and Update (<code>i++</code>, after each round). It prints 1, 2, 3."],
["When do you use while, and what is an infinite loop?","Use <code>while</code> when you don’t know how many rounds (e.g. ask for a password until right or 3 tries). If nothing inside the loop moves toward the end (forgetting <code>tries++</code>), the condition is true forever and the tab freezes. Escape: close the tab (Ctrl + W) and fix the code."]
]},
{c:"c3",n:"Chapter 3",t:"Chapter 3: Functions and Event Handling",s:"Functions, arrow functions, scope, events, forms",qa:[
["Why do we use functions?","Define once, call many times. Without a function, 30 students need 30 lines; with one, a new message means changing ONE line. The <code>( )</code> means: run it now."],
["Explain the parts of <code>function greet(name) { ... }</code>.","<code>function</code> = keyword; <code>greet</code> = the name (a camelCase verb); <code>(name)</code> = parameters (the information it needs, can be empty); <code>{ }</code> = the body, which runs ONLY when you call it: <code>greet(\"Amina\");</code>"],
["What is the difference between a parameter and an argument? What is a default value?","A parameter is the placeholder name in the definition (<code>name</code>); an argument is the actual value in the call (<code>\"Amina\"</code>). <code>greet()</code> with nothing gives “undefined”; a default <code>name = \"friend\"</code> fixes it."],
["What is the difference between return and console.log?","<code>return</code> gives the answer BACK to the caller (<code>add(2, 3) * 10</code> = 50). <code>console.log</code> only SHOWS it (the function then returns <code>undefined</code>, so <code>addLog(2, 3) * 10</code> is <code>NaN</code>). A function that calculates should return. Lines after <code>return</code> never run."],
["Describe the BMI functions of Chapter 3.","<code>calcBMI(weight, height)</code> does the maths (weight ÷ height²), <code>bmiCategory(bmi)</code> returns a word (below 18.5 Underweight, 18.5–under 25 Normal, 25–under 30 Overweight, 30+ Obese) and <code>bmiReport(...)</code> builds the sentence, e.g. “Amina: BMI 21.0 (Normal)”. <code>toFixed(1)</code> rounds to one decimal."],
["Show three ways to write the same function.","Declaration: <code>function square(n) { return n * n; }</code>. Expression: <code>const squareExp = function (n) { return n * n; };</code>. Arrow: <code>const squareArrow = (n) =&gt; n * n;</code>. They give 16, 25 and 36 for 4, 5 and 6."],
["How do arrow functions return values?","Read <code>=&gt;</code> as “gives”. With one line and no <code>{ }</code> the answer is returned automatically. With <code>{ }</code> you MUST write <code>return</code>, or you get <code>undefined</code>."],
["What error appears if you call an arrow function before its definition?","<code>ReferenceError: Cannot access 'squareArrow' before initialization</code>. A declaration works anywhere in the file, but arrows don’t. Rule: write functions at the TOP of app.js and call them below."],
["What is scope?","Where a variable lives. Inside can see out (a function can use a global <code>city</code>), but outside cannot see in: a variable made inside <code>{ }</code> does not exist outside (<code>ReferenceError: code is not defined</code>)."],
["What are the three steps of every event?","Find → Listen → React: 1) get the element with <code>getElementById</code>; 2) <code>addEventListener(\"click\", ...)</code>; 3) a function runs EVERY time the event happens."],
["Why no ( ) after addOne in <code>addEventListener(\"click\", addOne)</code>? What does “Cannot read properties of null” mean?","With <code>addOne()</code> it runs once at page load and clicks do nothing; give the NAME only, the browser calls it later. The null error means the id is wrong (case matters) or <code>&lt;script&gt;</code> is above the element, so put it last, before <code>&lt;/body&gt;</code>."],
["Which event is used when?","<code>\"click\"</code>: button click. <code>\"input\"</code>: every key typed in a text box. <code>\"change\"</code>: a choice is finished (checkbox, select). <code>\"submit\"</code>: form sent by button OR Enter. Lowercase, in quotes: a wrong name gives no error, nothing happens."],
["Why use event.preventDefault() on a form?","A form’s default is to send the data and RELOAD the page, so your result flashes and is gone. <code>preventDefault()</code> (the first line) stops the reload, so the page stays and your JavaScript is in charge."],
["Why must you use Number() with .value? What is the difference between .value and .textContent?","<code>.value</code> is always text (<code>'55'</code>), so wrap it: <code>Number(weightInput.value)</code>. Empty gives 0, so one check catches empty and 0. <code>.value</code> is the text IN a box; <code>.textContent</code> is the text of a <code>&lt;p&gt;</code> or <code>&lt;h1&gt;</code>."],
["How do you disable a button until a checkbox is ticked? Name the good habits.","<code>joinBtn.disabled = !agreeBox.checked;</code> using the <code>\"change\"</code> event. Habits: <code>textContent</code> for user text (not innerHTML, XSS), browser checks are for comfort (check on the server too), <code>addEventListener</code> not <code>onclick=</code>, and <code>&lt;script&gt;</code> last in <code>&lt;body&gt;</code>."]
]},
{c:"c4",n:"Chapter 4",t:"Chapter 4: Arrays and Objects",s:"Lists, records, loops, filter / map, nested data",qa:[
["What is an array and why use it?","An ordered list of values under ONE name, written with <code>[ ]</code> and commas: <code>const scores = [40, 55, 72, 48, 90];</code>. A class of 40 students needs 1 line instead of 40 variables."],
["What are index and length? What does <code>courses[3]</code> give for 3 items?","Each item has an index starting at 0. <code>length</code> counts the items; the last index is <code>length - 1</code>. <code>courses[3]</code> is <code>undefined</code> (no box 3), which is not a red error, so it can hide bugs."],
["How do you add and remove items at the ends?","End: <code>push(item)</code> adds, <code>pop()</code> removes the last and gives it back. Start: <code>unshift(item)</code> adds, <code>shift()</code> removes the first. <code>push</code> answers the new length, not an error."],
["How do you find an item and remove one from the middle? Can a const array change?","<code>includes(\"CSS\")</code> → true/false; <code>indexOf(\"CSS\")</code> → position (−1 = not there); <code>splice(1, 1)</code> cuts 1 item starting at index 1. A <code>const</code> array can still change inside; only giving it a new array (<code>courses = []</code>) is an error."],
["Name the three ways to loop through an array.","<code>for (let i = 0; i &lt; scores.length; i++)</code> when you need the position; <code>for (const score of scores)</code> the simplest, use by default; <code>scores.forEach((score, index) =&gt; { ... })</code> a method. Off by one: <code>i &lt;= scores.length</code> prints an extra <code>undefined</code>."],
["What is the difference between filter and map?","Both return a NEW array and the original does not change. <code>filter</code> keeps the items that pass a test: <code>scores.filter((s) =&gt; s &gt;= 50)</code> → 55 72 90. <code>map</code> changes every item: <code>scores.map((s) =&gt; s + 5)</code> → 45 60 77 53 95."],
["How do you compute total, average and count?","Total: start at 0 and <code>total += score</code> (305). Average: <code>total / scores.length</code> (61). Count: start a counter at 0 and add 1 only IF the score is 50 or more (3 passed). <code>scores.join(\", \")</code> prints the list."],
["Why use objects instead of arrays for a record?","An array uses numbers (<code>student[2]</code>: 2 what?). An object uses labels (<code>student.year</code>), so the label says what the value means. All scores of a class → array; one phone → object; every phone in a shop → array of objects."],
["Describe the anatomy of an object. How do you change, add and delete properties?","<code>{ }</code> with <code>key: value</code> pairs separated by commas (a missing comma gives SyntaxError); values can be any type, even arrays or objects. Change: <code>student.year = 3</code>. Add: <code>student.email = \"...\"</code>. Delete: <code>delete student.email</code>. A missing key gives <code>undefined</code>. A const object’s properties can still change."],
["Dot or bracket: when do you use each?","Dot (<code>student.fullName</code>) almost always. Bracket (<code>student[\"year\"]</code> or <code>student[key]</code>) when the key is in a variable. Trap: <code>student.key</code> looks for a property called “key” and gives <code>undefined</code>."],
["What are methods and this? Why not use an arrow function for a method?","A method is a function inside an object: <code>introduce() { return `I am ${this.fullName}...`; }</code>. <code>this</code> is the object before the dot (<code>student.introduce()</code> → <code>this</code> is <code>student</code>). An arrow function has no <code>this</code>, so you get “I am undefined…”."],
["What is nested data, and what error does a typo cause?","Objects and arrays inside objects: <code>student.address.city</code> → “Borama”, <code>student.courses[1]</code>. Read the path left to right; every step must exist. <code>student.adress.city</code> gives <code>TypeError: Cannot read properties of undefined</code>."],
["How do you visit every key of an object?","<code>for (const key in student.address) { console.log(`${key}: ${student.address[key]}`); }</code> (use brackets, never <code>.key</code>). <code>Object.keys(student)</code> gives all keys as an array. Arrays → <code>for...of</code> (values); objects → <code>for...in</code> (keys)."],
["What is a list of records (product catalog)? Give examples of filtering.","An array where every item is an object with the same keys (name, category, price, inStock). Phones only: <code>product.category === \"Phones\"</code> (2); in stock only: <code>product.inStock</code> (4); stock value: <code>stockValue += product.price</code> (1165 USD)."],
["Name the four classic object mistakes.","<code>[object Object]</code> on the page (print one property: <code>${student.fullName}</code>); <code>SyntaxError: Unexpected identifier</code> (missing comma, look one line up); price <code>\"120\"</code> is text (<code>\"120\" + 8</code> = “1208”, use <code>price: 120</code>); <code>\"phones\"</code> is not <code>\"Phones\"</code> (=== is exact, no error, empty page)."]
]}
];

document.querySelectorAll("section").forEach((s,i)=>{
  const L=M[i]; if(!L) return;
  const z=document.createElement("div"); z.className="quiz";
  z.innerHTML=`<div class="head"><div><h3>✏️ Dooro jawaabta saxda ah</h3><small>Guji goobadda (circle) jawaabta saxda ah · Dhibco: <b class="sc">0/${L.length}</b></small></div><button type="button" class="rs">Dib u bilow</button></div>`+
  L.map((x,k)=>`<div class="mq" data-a="${x[2]}"><p><b>${k+1}.</b> ${x[0]}</p>${x[1].map((o,j)=>`<button type="button" class="op" data-j="${j}"><span class="ci">${"ABCD"[j]}</span><span>${o}</span></button>`).join("")}</div>`).join("");
  s.querySelector(".wrap").appendChild(z);
});
function upd(z){z.querySelector(".sc").textContent=z.querySelectorAll(".mq.right").length+"/"+z.querySelectorAll(".mq").length}
document.addEventListener("click",e=>{
  const o=e.target.closest(".op"), r=e.target.closest(".rs");
  if(o){const q=o.closest(".mq"); if(q.classList.contains("done")) return;
    q.classList.add("done"); const a=+q.dataset.a;
    q.querySelectorAll(".op").forEach((b,j)=>{if(j===a)b.classList.add("ok"); else if(b===o)b.classList.add("no");});
    if(+o.dataset.j===a) q.classList.add("right"); upd(q.closest(".quiz"));}
  if(r){const z=r.closest(".quiz"); z.querySelectorAll(".mq").forEach(q=>{q.className="mq";q.querySelectorAll(".op").forEach(b=>b.className="op")}); upd(z);}
});
function show(){
  let id=location.hash.slice(1); if(!/^ch[1-4]$/.test(id)) id="ch1";
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id));
  window.scrollTo(0,0);
}
addEventListener("hashchange",show);show();
</script>
