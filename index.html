<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle SQL – Sual iyo Jawaab</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b1f2a;--muted:#5b6475;--border:#dde2ee;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#eef0f6;--muted:#a3adc0;--border:#2d3445;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#eef0f6;--muted:#a3adc0;--border:#2d3445;color-scheme:dark}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{text-align:center;padding:36px 16px 20px}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,36px)}
header p{margin:0;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;background:var(--a)}
nav a{opacity:.55}nav a.on{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 35%,transparent)}
section{display:none}section.on{display:block}
.c1{--a:#d9480f}.c2{--a:#0f766e}.c3{--a:#7c3aed}.c4{--a:#2563eb}
section{background:color-mix(in srgb,var(--a) 10%,var(--bg));border-top:6px solid var(--a);padding:28px 16px 36px}
.wrap{max-width:820px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.head h2{margin:0;font-size:22px;color:var(--a)}
.head small{display:block;color:var(--muted);font-size:14px}
button{font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--a);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
details{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--a);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"Q" counter(q);counter-increment:q;color:var(--a);margin-right:8px;font-weight:800}
.qs{counter-reset:q}
details[open] summary{border-bottom:1px dashed var(--border)}
.ans{padding:12px 14px;color:var(--text)}
.ans::before{content:"Jawaab: ";color:var(--a);font-weight:700}
code{background:color-mix(in srgb,var(--a) 14%,var(--card));padding:1px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:.92em}

.quiz{margin-top:30px;padding-top:20px;border-top:2px dashed var(--a)}
.quiz h3{margin:0;font-size:20px;color:var(--a)}
.mq{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.mq p{margin:0 0 6px}
.op{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;color:var(--text);font-weight:500;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px}
.op .ci{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--a);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--a)}
.op:hover{background:color-mix(in srgb,var(--a) 10%,var(--card))}
.mq.done .op{cursor:default}
.op.ok{background:color-mix(in srgb,#16a34a 18%,var(--card));border-color:#16a34a}
.op.ok .ci{background:#16a34a;border-color:#16a34a;color:#fff}
.op.no{background:color-mix(in srgb,#dc2626 16%,var(--card));border-color:#dc2626}
.op.no .ci{background:#dc2626;border-color:#dc2626;color:#fff}
footer{text-align:center;color:var(--muted);padding:20px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🗄️ Oracle SQL – Sual iyo Jawaab</h1>
  <p>Junior BSE · Amoud University · 3 chapter · guji sual kasta si aad jawaabta u aragto</p>
</header>

<main id="main"></main>
<footer>Waxaa laga sameeyay handout-ka Oracle Database · Guul!</footer>
<script>
const D=[
{c:"c1",n:"Chapter 1",t:"Chapter 1: Introduction to Oracle Database",s:"Databases, DBMS, Oracle architecture, SQL categories, data types",qa:[
["What is the difference between data and information?","Data is raw facts, figures and observations (names, IDs, salaries, prices). Information is data organized or interpreted to give meaning, e.g. “Student ID 101, First Name Ahmed, Department Engineering, Age 22”."],
["What is a database, and why do we need one?","A database is an organized collection of related data stored electronically that can be accessed, managed, updated and retrieved efficiently. It helps to store large amounts of information, retrieve it quickly, reduce duplication, keep data accurate and consistent, protect it from unauthorized access, let many users share it, maintain integrity and support decision-making."],
["What is a DBMS, and what are its functions?","Database Management System: software to create, store, organize, retrieve, modify and manage data. Functions: data definition, data manipulation, data retrieval, security management, transaction management, backup and recovery, and concurrency control."],
["Give examples of DBMS software.","Oracle Database (Oracle), Microsoft SQL Server (Microsoft), MySQL (Oracle), PostgreSQL, SQLite and Microsoft Access."],
["Name the four types of database systems.","<b>Hierarchical</b>: tree-like parent–child structure. <b>Network</b>: interconnected records, a record can have multiple parents. <b>Relational</b>: tables of rows and columns connected by primary and foreign keys. <b>NoSQL</b>: other models (document, key-value, graph, wide-column), e.g. MongoDB, Redis, Cassandra."],
["What is Oracle Database, and what are its major features?","A relational database management system (RDBMS) by Oracle Corporation used in banking, government, universities, healthcare, telecom and large enterprises. Features: data security, data integrity (constraints), transaction management (<code>COMMIT</code>, <code>ROLLBACK</code>, <code>SAVEPOINT</code>), concurrency, backup and recovery, scalability, SQL support and PL/SQL support."],
["Compare Oracle Database and SQL Server.","Oracle uses <code>VARCHAR2</code>, <code>NUMBER</code>, <code>SYSDATE</code>, <code>FETCH FIRST 5 ROWS ONLY</code>, <code>NVL()</code>, <code>LENGTH()</code>, PL/SQL, and SQL Developer or SQL*Plus. SQL Server uses <code>VARCHAR</code>, <code>INT</code>, <code>GETDATE()</code>, <code>TOP 5</code>, <code>ISNULL()</code>, <code>LEN()</code>, T-SQL and SSMS."],
["What is the difference between an Oracle database and an Oracle instance?","The <b>database</b> is the stored files: data files, control files and online redo log files (plus logical structures: tablespaces, segments, extents, data blocks). The <b>instance</b> is memory (the SGA, System Global Area) plus background processes such as DBWn, LGWR, CKPT, SMON and PMON."],
["Define table, row, column and cell.","A table organizes related information into rows and columns. A row is one complete record (101, Ahmed, Ali, 22). A column is one attribute (StudentID, Age). A cell is one value at the intersection of a row and a column."],
["What are primary key, foreign key and the types of relationship?","A primary key uniquely identifies each record: unique, not NULL, only one per table (can use several columns). A foreign key references a primary or unique key in another table and keeps referential integrity. Relationships: One-to-One, One-to-Many and Many-to-Many (implemented with a junction table)."],
["What is a schema? Name some Oracle database objects.","A schema is a collection of database objects owned by a database user. Objects: TABLE (stores data), VIEW (logical representation of a query), INDEX (faster retrieval), SEQUENCE (sequential numbers), SYNONYM (alternative name), PROCEDURE, FUNCTION and TRIGGER."],
["What is the difference between SQL and PL/SQL?","SQL is the standard language to talk to relational databases (<code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>). PL/SQL is Oracle’s procedural extension with variables, conditions, loops, procedures, functions and exception handling (<code>BEGIN ... END;</code>)."],
["What are the five categories of SQL commands?","DDL (<code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>TRUNCATE</code>, <code>RENAME</code>); DML (<code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>MERGE</code>); DQL (<code>SELECT</code>); DCL (<code>GRANT</code>, <code>REVOKE</code>); TCL (<code>COMMIT</code>, <code>ROLLBACK</code>, <code>SAVEPOINT</code>). Oracle normally commits implicitly before and after successful DDL."],
["Name the Oracle data types. What is the difference between CHAR and VARCHAR2?","<code>CHAR(n)</code> is fixed-length; <code>VARCHAR2(n)</code> is variable-length. Numeric: <code>NUMBER</code>, <code>NUMBER(p,s)</code> (<code>NUMBER(10,2)</code> = 10 digits, 2 after the decimal point), <code>BINARY_FLOAT</code>, <code>BINARY_DOUBLE</code>. Date: <code>DATE</code>, <code>TIMESTAMP</code> (+ time zone variants). Large objects: <code>CLOB</code>, <code>NCLOB</code>, <code>BLOB</code>, <code>BFILE</code>."],
["What are SQL Developer, SQL*Plus and the DUAL table?","SQL Developer is a graphical tool to connect, run SQL and PL/SQL, manage tables and export/import data. SQL*Plus is the command-line interface. Connection needs username, password, hostname, port (commonly 1521) and service name. <code>DUAL</code> is a one-row table used to evaluate expressions: <code>SELECT USER FROM DUAL;</code>"]
]},
{c:"c2",n:"Chapter 2",t:"Chapter 2: ALTER TABLE and Data Integrity Constraints",s:"Modify tables, constraints, DEFAULT, sequences and identity",qa:[
["What is the purpose of ALTER TABLE?","It is a DDL command that changes the structure of an existing table instead of deleting and recreating it: add columns, remove columns, change column definitions, rename columns and add or remove constraints. Syntax: <code>ALTER TABLE table_name action;</code>"],
["How do you add one or many columns?","<code>ALTER TABLE Students ADD (Email VARCHAR2(100));</code> For several: <code>ADD (Phone VARCHAR2(20), DateOfBirth DATE, Address VARCHAR2(150));</code> Check the structure with <code>DESC Students;</code>"],
["How do you drop a column, and what is the warning?","<code>ALTER TABLE Students DROP COLUMN Email;</code> It is destructive: the column’s data is permanently removed."],
["How do you rename a column and a table in Oracle?","Column: <code>ALTER TABLE Students RENAME COLUMN FirstName TO GivenName;</code> Table: <code>RENAME Students TO UniversityStudents;</code> Oracle does not use <code>ALTER TABLE ... RENAME TO</code> for ordinary table renaming (unlike SQL Server’s sp_rename)."],
["What can MODIFY do, and what is its limitation?","It changes a column definition: increase/decrease size (<code>MODIFY (LastName VARCHAR2(100))</code>), add <code>NOT NULL</code>, or allow <code>NULL</code>. Oracle rejects it if existing data violates the new definition (you cannot add NOT NULL while the column has NULLs). Oracle uses MODIFY, not SQL Server’s ALTER COLUMN."],
["What are constraints, and what are the five types?","Rules applied to columns to keep data accurate, consistent and reliable. Types: NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY and CHECK. (DEFAULT is a column definition feature, not a separate constraint.)"],
["Explain NOT NULL. What error does inserting NULL give?","It prevents NULL (missing/unknown, not zero or an empty string). Create: <code>FirstName VARCHAR2(50) NOT NULL</code>; add: <code>ALTER TABLE Students MODIFY (Age NOT NULL);</code>; remove: <code>MODIFY (Age NULL);</code>. Inserting NULL gives <code>ORA-01400: cannot insert NULL into (...)</code>."],
["Explain the UNIQUE constraint (named, composite, drop).","It prevents duplicate non-NULL values: <code>Email VARCHAR2(100) UNIQUE</code>. Named: <code>CONSTRAINT UQ_Student_Email UNIQUE (Email)</code>. Composite: <code>UNIQUE (StudentID, CourseID)</code> stops the same student registering for the same course twice. Drop: <code>ALTER TABLE Students DROP CONSTRAINT UQ_Student_Email;</code> Multiple NULLs may be allowed; UNIQUE is not NOT NULL."],
["What is the difference between UNIQUE and PRIMARY KEY?","A PRIMARY KEY is UNIQUE + NOT NULL and identifies the main key; a table has only ONE primary key (it can be composite, e.g. <code>PRIMARY KEY (StudentID, CourseID)</code>). UNIQUE can allow NULL, and a table can have several UNIQUE constraints. Add: <code>ALTER TABLE Students ADD CONSTRAINT PK_Students PRIMARY KEY (StudentID);</code>"],
["What is a FOREIGN KEY, referential integrity, and parent/child table?","A foreign key links two tables: a value in the child table must exist in the parent table’s key. The parent (Departments) holds the referenced key; the child (Students) holds the foreign key; referential integrity keeps the relationship valid. <code>CONSTRAINT FK_Student_Department FOREIGN KEY (DepartmentID) REFERENCES Departments(DepartmentID)</code>"],
["What happens if you insert DepartmentID 50 that doesn’t exist in the parent table?","It is rejected: <code>ORA-02291: integrity constraint (FK_STUDENT_DEPARTMENT) violated - parent key not found</code>. IDs 10, 20 or 30 would be valid."],
["What does ON DELETE CASCADE do?","Added to a foreign key, it automatically deletes child records when the parent record is deleted. Warning: deleting one department deletes all students in it, so use it carefully."],
["What does CHECK do? What is the NULL caveat?","It enforces a condition: <code>Age NUMBER(3) CHECK (Age &gt;= 18)</code>, or several: <code>CHECK (Salary &gt; 0 AND Age &gt;= 18)</code>. A FALSE condition is rejected, but UNKNOWN (because of NULL) may be accepted, so also use NOT NULL when a value is required."],
["What is DEFAULT, and how is it different from NOT NULL?","DEFAULT supplies a value when INSERT omits the column: <code>Status VARCHAR2(20) DEFAULT 'Active'</code>, or <code>OrderDate DATE DEFAULT SYSDATE</code>. Change with <code>MODIFY (Status DEFAULT 'Active')</code>; remove with <code>DEFAULT NULL</code>. It does not prevent NULL: a user can insert NULL explicitly unless NOT NULL is also set."],
["Compare SEQUENCE and IDENTITY. What are NEXTVAL and CURRVAL?","A SEQUENCE is an independent object (<code>CREATE SEQUENCE SEQ_STUDENTS START WITH 1 INCREMENT BY 1 NOCYCLE CACHE 20;</code>), shareable across tables, used with <code>SEQ_STUDENTS.NEXTVAL</code> in INSERT. IDENTITY (12c+) belongs to a column: <code>StudentID NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY</code>, values generated automatically. <code>NEXTVAL</code> generates the next number; <code>CURRVAL</code> returns the current one but only after NEXTVAL was called in that session."]
]},
{c:"c3",n:"Chapter 3",t:"Chapter 3: Data Retrieval, Sorting, Row Limiting and Operators",s:"SELECT, DISTINCT, FETCH FIRST, aliases, ORDER BY, SQL operators",qa:[
["What is the SELECT statement? What is the difference between SELECT * and specific columns?","It retrieves data from tables: <code>SELECT column1, column2 FROM table_name;</code>. <code>SELECT *</code> returns all columns and is fine for testing, but in production select only the required columns for better performance."],
["What does SELECT DISTINCT do? How do you count unique values?","It removes duplicate values: <code>SELECT DISTINCT Country FROM Customers;</code> gives Germany, Mexico, UK, Sweden (Mexico once). With several columns, DISTINCT looks at the whole combination. Count: <code>SELECT COUNT(DISTINCT Country) AS TotalCountries FROM Customers;</code> → 4."],
["How do you limit rows in Oracle? How does it differ from other databases?","Oracle 12c+: <code>FETCH FIRST 3 ROWS ONLY</code> (also <code>FETCH FIRST 50 PERCENT ROWS ONLY</code>), usually after <code>ORDER BY</code>. SQL Server uses <code>TOP</code>, MySQL uses <code>LIMIT</code>, older Oracle versions use <code>ROWNUM</code>."],
["How does pagination with OFFSET work? Why is ROWNUM tricky?","<code>ORDER BY CustomerID OFFSET 2 ROWS FETCH NEXT 2 ROWS ONLY</code> skips the first 2 records and returns the next 2. <code>ROWNUM</code> (legacy) is evaluated BEFORE <code>ORDER BY</code>, so sort in a subquery first, then <code>WHERE ROWNUM &lt;= 3</code>."],
["What are column and table aliases? How are they written in Oracle?","An alias is a temporary name that exists only for the query. Column: <code>CustomerID AS ID</code>; with spaces use double quotes: <code>CustomerName AS \"Customer Name\"</code> (never SQL Server’s [square brackets]). Table alias is written without AS: <code>FROM Customers c</code>, e.g. <code>c.CustomerName</code>."],
["Which operator concatenates strings in Oracle?","The double pipe <code>||</code>: <code>SELECT CustomerName || ', ' || Country AS CustomerInformation FROM Customers;</code> (SQL Server uses <code>+</code>)."],
["What does ORDER BY do? Explain ASC and DESC.","It sorts the result. <code>ASC</code> (default) = A to Z / smallest first; <code>DESC</code> = Z to A / largest first. Multiple columns: <code>ORDER BY Country ASC, CustomerName DESC</code>. Use it whenever a specific order is required, e.g. <code>ORDER BY Price DESC FETCH FIRST 3 ROWS ONLY</code> gives the 3 most expensive products."],
["What are the arithmetic operators? How do you get a remainder in Oracle?","<code>+ - * /</code>, e.g. <code>Price * 2 AS DoublePrice</code>. Oracle does NOT use <code>%</code>; use <code>MOD(n1, n2)</code>: <code>SELECT MOD(10, 3) AS Remainder FROM DUAL;</code> → 1 (<code>MOD(StudentID, 2)</code> finds even and odd IDs)."],
["List the comparison operators.","<code>=</code> equal, <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code> and <code>&lt;&gt;</code> or <code>!=</code> not equal, e.g. <code>SELECT * FROM Customers WHERE Country &lt;&gt; 'Germany';</code>"],
["Explain AND, OR and NOT.","<code>AND</code>: all conditions must be TRUE (<code>Price &gt; 50 AND Category = 'Furniture'</code>). <code>OR</code>: at least one must be TRUE (<code>Country = 'Germany' OR Country = 'Mexico'</code>). <code>NOT</code> reverses a condition (<code>WHERE NOT Country = 'Germany'</code>)."],
["What do BETWEEN and IN do?","<code>BETWEEN</code> selects an inclusive range: <code>Price BETWEEN 50 AND 200</code> (both ends included). <code>IN</code> matches any value in a list: <code>Country IN ('Germany', 'Mexico', 'UK')</code>."],
["What are the LIKE wildcards? Give examples.","<code>%</code> = zero, one or many characters; <code>_</code> = exactly one character. <code>LIKE 'A%'</code> starts with A; <code>'%a'</code> ends with a; <code>'%o%'</code> contains o; <code>'____'</code> exactly 4 characters."],
["How do you test for NULL?","Use <code>IS NULL</code> and <code>IS NOT NULL</code> (<code>WHERE Email IS NULL</code>). Never use <code>= NULL</code> or <code>&lt;&gt; NULL</code>."],
["What do EXISTS, ANY and ALL do?","<code>EXISTS</code> is TRUE if a subquery returns rows (e.g. departments that have students). <code>Price &gt; ANY (subquery)</code> is TRUE if the price is higher than AT LEAST ONE value; <code>Price &gt; ALL (subquery)</code> is TRUE if higher than EVERY value."],
["Name the main Oracle vs SQL Server differences in this chapter.","Limit rows: <code>FETCH FIRST 5 ROWS ONLY</code> vs <code>TOP 5</code>. Table alias: no AS in Oracle. Concatenation: <code>||</code> vs <code>+</code>. Modulus: <code>MOD()</code> vs <code>%</code>. Row numbering: FETCH / ROWNUM vs TOP / ROW_NUMBER(). Oracle SELECT does not support <code>+=</code>, <code>-=</code>, <code>*=</code>, <code>/=</code>."]
]}
];
const nav=document.getElementById("nav"),main=document.getElementById("main");
D.forEach((ch,i)=>{
  const id="ch"+(i+1);
  nav.insertAdjacentHTML("beforeend",`<a class="${ch.c}" href="#${id}">${ch.n}</a>`);
  main.insertAdjacentHTML("beforeend",`<section id="${id}" class="${ch.c}"><div class="wrap">
    <div class="head"><div><h2>${ch.t}</h2><small>${ch.s} · ${ch.qa.length} sual</small></div>
    <button type="button" data-open="0">Tus dhammaan jawaabaha</button></div>
    <div class="qs">${ch.qa.map(([q,a])=>`<details><summary>${q}</summary><div class="ans">${a}</div></details>`).join("")}</div></div></section>`);
});
main.addEventListener("click",e=>{
  const b=e.target.closest("button[data-open]"); if(!b) return;
  const open=b.dataset.open==="0";
  b.closest("section").querySelectorAll("details").forEach(d=>d.open=open);
  b.dataset.open=open?"1":"0";
  b.textContent=open?"Qari dhammaan jawaabaha":"Tus dhammaan jawaabaha";
});
const M=[
[["Oracle Database is developed by…",["Microsoft","Oracle Corporation","IBM","MySQL AB"],1],
 ["Which key uniquely identifies each record in a table?",["Foreign key","Primary key","Alias","Schema"],1],
 ["Which category does <code>SELECT</code> belong to in this handout?",["DDL","DQL","DCL","TCL"],1],
 ["Which is Oracle’s preferred variable-length character type?",["VARCHAR","CHAR","VARCHAR2","TEXT"],2],
 ["Which one-row table is used to evaluate expressions?",["DUAL","SINGLE","ROW1","SYS"],0]],
[["How do you rename a column in Oracle?",["ALTER COLUMN a TO b","RENAME COLUMN old TO new","CHANGE a b","SET NAME"],1],
 ["Which constraint is both UNIQUE and NOT NULL?",["UNIQUE","CHECK","PRIMARY KEY","DEFAULT"],2],
 ["<code>ORA-02291</code> means…",["NULL inserted","parent key not found","duplicate value","value too large"],1],
 ["<code>NEXTVAL</code> does what?",["Returns the current number","Generates the next sequence number","Drops the sequence","Restarts it"],1],
 ["Which constraint enforces <code>Age &gt;= 18</code>?",["CHECK","DEFAULT","UNIQUE","FOREIGN KEY"],0]],
[["Which clause limits rows in Oracle 12c and later?",["TOP","LIMIT","FETCH FIRST","ROWNUM only"],2],
 ["Which operator concatenates strings in Oracle?",["+","||","&","%"],1],
 ["How do you get a remainder in Oracle?",["%","MOD()","REM","MODULUS()"],1],
 ["How do you test for a missing value?",["= NULL","IS NULL","== NULL","&lt;&gt; NULL"],1],
 ["<code>LIKE 'A%'</code> finds values that…",["end with A","start with A","have exactly 1 character","contain only A"],1]]
]
;

document.querySelectorAll("section").forEach((s,i)=>{
  const L=M[i]; if(!L) return;
  const z=document.createElement("div"); z.className="quiz";
  z.innerHTML=`<div class="head"><div><h3>✏️ Dooro jawaabta saxda ah</h3><small>Guji goobadda (circle) jawaabta saxda ah · Dhibco: <b class="sc">0/${L.length}</b></small></div><button type="button" class="rs">Dib u bilow</button></div>`+
  L.map((x,k)=>`<div class="mq" data-a="${x[2]}"><p><b>${k+1}.</b> ${x[0]}</p>${x[1].map((o,j)=>`<button type="button" class="op" data-j="${j}"><span class="ci">${"ABCD"[j]}</span><span>${o}</span></button>`).join("")}</div>`).join("");
  s.querySelector(".wrap").appendChild(z);
});
function upd(z){z.querySelector(".sc").textContent=z.querySelectorAll(".mq.right").length+"/"+z.querySelectorAll(".mq").length}
document.addEventListener("click",e=>{
  const o=e.target.closest(".op"), r=e.target.closest(".rs");
  if(o){const q=o.closest(".mq"); if(q.classList.contains("done")) return;
    q.classList.add("done"); const a=+q.dataset.a;
    q.querySelectorAll(".op").forEach((b,j)=>{if(j===a)b.classList.add("ok"); else if(b===o)b.classList.add("no");});
    if(+o.dataset.j===a) q.classList.add("right"); upd(q.closest(".quiz"));}
  if(r){const z=r.closest(".quiz"); z.querySelectorAll(".mq").forEach(q=>{q.className="mq";q.querySelectorAll(".op").forEach(b=>b.className="op")}); upd(z);}
});
function show(){
  let id=location.hash.slice(1); if(!/^ch[1-3]$/.test(id)) id="ch1";
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id));
  window.scrollTo(0,0);
}
addEventListener("hashchange",show);show();
</script>
</body>
