<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Java – Sual iyo Jawaab</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b1f2a;--muted:#5b6475;--border:#dde2ee;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#eef0f6;--muted:#a3adc0;--border:#2d3445;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#eef0f6;--muted:#a3adc0;--border:#2d3445;color-scheme:dark}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{text-align:center;padding:36px 16px 20px}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,36px)}
header p{margin:0;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;background:var(--a)}
nav a{opacity:.55}nav a.on{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 35%,transparent)}
section{display:none}section.on{display:block}
.c1{--a:#d9480f}.c2{--a:#0f766e}.c3{--a:#7c3aed}.c4{--a:#2563eb}
section{background:color-mix(in srgb,var(--a) 10%,var(--bg));border-top:6px solid var(--a);padding:28px 16px 36px}
.wrap{max-width:820px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.head h2{margin:0;font-size:22px;color:var(--a)}
.head small{display:block;color:var(--muted);font-size:14px}
button{font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--a);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
details{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--a);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"Q" counter(q);counter-increment:q;color:var(--a);margin-right:8px;font-weight:800}
.qs{counter-reset:q}
details[open] summary{border-bottom:1px dashed var(--border)}
.ans{padding:12px 14px;color:var(--text)}
.ans::before{content:"Jawaab: ";color:var(--a);font-weight:700}
code{background:color-mix(in srgb,var(--a) 14%,var(--card));padding:1px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:.92em}
footer{text-align:center;color:var(--muted);padding:20px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>☕ Java – Sual iyo Jawaab</h1>
  <p>Object Oriented Programming II · 4 chapter · guji sual kasta si aad jawaabta u aragto</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>Waxaa laga sameeyay slides-ka Chapter 1–4 · Guul!</footer>
<script>
const D=[
{c:"c1",t:"Chapter 1: Introduction to Java Programming",s:"History, features, JDK / JRE / JVM",qa:[
["Who developed Java, and in which year?","Java was developed by James Gosling and his team at Sun Microsystems in 1995. Oracle acquired Sun Microsystems in 2010."],
["What was Java’s original name, and why was it changed?","It was called <code>Oak</code>. The name was changed to Java because Oak was already a registered company/trademark."],
["Why is Java called both a language and a platform?","It is a high-level, object-oriented, secure language, and it also has a runtime environment (JRE) and an API, so it is a platform too."],
["Name four features of Java.","Simple, Portable, Object-Oriented, Platform-Independent, Secure, Multithreaded, Robust, Dynamic (any four)."],
["What does WORA mean?","“Write Once, Run Anywhere”: Java code is compiled into bytecode that runs on any system that has a JVM."],
["Why is Java platform-independent?","Because source code is compiled into bytecode, and the JVM on each system converts that bytecode into machine-specific code."],
["What does JDK stand for and what does it provide?","Java Development Kit. It provides the tools to write, compile (<code>javac</code>), debug and run Java programs. It contains the JRE."],
["What is the JRE, and does it contain a compiler?","Java Runtime Environment: it contains the JVM, core libraries and runtime components to execute programs. It does <b>not</b> contain a compiler or debugger."],
["What does the JVM do?","The Java Virtual Machine converts bytecode into machine code and runs it. It also handles memory management, garbage collection and security."],
["What is the difference between JDK and JRE?","JDK is for developing Java programs; JRE is for running them. JDK is a superset of JRE."],
["Which Java version introduced Generics and the enhanced for-loop?","Java 5 (2004)."],
["What did Java 9 introduce (2017)?","Modularity, through the Java Platform Module System (JPMS)."],
["Why is Java called “robust”?","It has automatic garbage collection and strong memory management that help prevent crashes."],
["Where is Java used today?","Internet programming, mobile devices, games, e-business solutions and more."]
]},
{c:"c2",t:"Chapter 2: Elementary Programming",s:"Variables, data types, strings, operators",qa:[
["What is a variable?","A container that holds a value while the program runs. Every variable has a data type."],
["Write the syntax for declaring a variable.","<code>type variableName = value;</code> for example <code>String name = \"Jama\";</code>"],
["Name four basic variable types and what they store.","<code>String</code> – text; <code>int</code> – whole numbers; <code>char</code> – a single character; <code>boolean</code> – true or false."],
["What is the final keyword used for?","It makes a variable a constant (read-only). <code>final int myNum = 15; myNum = 20;</code> gives an error."],
["How can you declare several variables of the same type in one line?","Use a comma-separated list: <code>int x = 5, y = 6, z = 60;</code>"],
["How do you give the same value to several variables?","<code>int x, y, z; x = y = z = 60;</code>"],
["What are identifiers? Give the naming rules.","Unique names of variables. They may contain letters, digits, underscores and $; must not start with a digit; no spaces; are case sensitive; cannot be reserved words; should start with a lowercase letter."],
["What are keywords?","Reserved words with a special meaning in Java, such as <code>class</code>, <code>int</code>, <code>public</code>, <code>if</code>, <code>while</code>. They cannot be used as variable names."],
["What are the two groups of data types?","Primitive types (byte, short, int, long, float, double, boolean, char) and non-primitive/reference types (String, Arrays, Classes)."],
["Give three differences between primitive and non-primitive types.","Primitives are predefined and non-primitives are created by the programmer (except String); non-primitives can call methods and can be <code>null</code>; primitives start with a lowercase letter, non-primitives with an uppercase letter."],
["How can you join two strings?","With the <code>+</code> operator (<code>first + \" \" + second</code>) or the <code>concat()</code> method (<code>first.concat(second)</code>)."],
["Name the four groups of operators.","Arithmetic, Assignment, Comparison (relational) and Logical operators."],
["With <code>int a = 10, b = 5;</code> what do <code>a + b</code> and <code>a % b</code> print?","<code>15</code> and <code>0</code> (the remainder of 10 ÷ 5)."],
["With <code>a = 10, b = 5</code>, what do <code>(a &gt; b) &amp;&amp; (b &lt; 10)</code> and <code>!(a &gt; b)</code> print?","<code>true</code> and <code>false</code>."]
]},
{c:"c3",t:"Chapter 3: Control Statements and Arrays",s:"if / else, switch, loops, arrays",qa:[
["List the six comparison operators.","<code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>==</code>, <code>!=</code>"],
["What does the if statement do?","It runs a block of code only if its condition is true: <code>if (condition) { ... }</code>"],
["What is the purpose of else and else if?","<code>else</code> runs when the condition is false; <code>else if</code> tests a new condition when the first one is false."],
["What is printed? <code>int time = 20; if (time &lt; 18) {\"Good Day\"} else {\"Good Evening\"}</code>","“Good Evening”, because 20 is not less than 18, so the else block runs."],
["What is printed? <code>int age = 18; if (age &gt;= 18) { print(\"You are eligible to vote.\"); }</code>","“You are eligible to vote.”, because 18 &gt;= 18 is true."],
["When do we use a switch statement?","Instead of many if…else statements, when we choose one of many code blocks based on a single variable."],
["What is the job of break in a switch?","It exits the switch block, so no more cases are tested or executed."],
["What is the default keyword for?","It specifies code that runs when no case matches."],
["What is printed? <code>int day = 2; switch(day){case 1: ...\"Monday\"; break; case 2: ...\"Tuesday\"; break; default: ...}</code>","<code>Tuesday</code>"],
["Name the three kinds of loops.","<code>for</code> loop, <code>while</code> loop and <code>do/while</code> loop."],
["What are the three parts of a for loop?","Initialization (runs once before the loop), condition (checked before each round) and update (runs after each round): <code>for (int x = 0; x &lt; 5; x++)</code>"],
["What does <code>for (int x = 0; x &lt; 5; x++) System.out.println(x);</code> print?","The numbers 0, 1, 2, 3, 4."],
["What does <code>for (int x = 0; x &lt;= 10; x = x + 2)</code> print?","The even numbers 0, 2, 4, 6, 8, 10."],
["When do we use a while loop, and how is do/while different?","While is used when we don’t know how many times to repeat. A do/while loop runs the code block <b>once before</b> checking the condition."],
["What is an array? How do you declare and fill one?","A collection of values of the same type under one variable name: <code>String[] names = {\"Ahmed\", \"Ali\", \"Muna\", \"Farah\"};</code>"],
["How do you access and change an array element?","By index (starting at 0): <code>names[0]</code> gives “Ahmed”; <code>names[0] = \"Hassan\";</code> changes it."],
["How do you find the size of an array?","Use the <code>length</code> property: <code>names.length</code> is 4."],
["How do you print a whole array, and what must you import?","<code>System.out.println(Arrays.toString(numbers));</code> with <code>import java.util.Arrays;</code>"],
["What is a multidimensional array? What is <code>numbers[1][2]</code> in <code>{{1,2,3,4},{5,6,7}}</code>?","An array of arrays (like a table of rows and columns). <code>numbers[1][2]</code> is <code>7</code>: the third element of the second array."]
]},
{c:"c4",t:"Chapter 4: Java Methods",s:"Declaring, calling, parameters and return values",qa:[
["What is a method?","A named block of Java statements that performs a specific task and runs when it is called."],
["Why do we use methods?","Code reuse, readability, easier maintenance (change in one place) and easier testing."],
["Explain the parts of <code>public static int add(int first, int second)</code>.","<code>public</code> – accessible from other classes; <code>static</code> – called without creating an object; <code>int</code> – return type; <code>add</code> – method name; <code>first, second</code> – parameters."],
["What does void mean?","The method does not return a value."],
["What is the difference between a parameter and an argument?","A parameter is the variable in the method definition; an argument is the actual value supplied when calling it. In <code>greet(\"Ahmed\")</code>, <code>name</code> is the parameter and <code>\"Ahmed\"</code> is the argument."],
["What is printed by <code>greet(\"Amina\");</code> if greet prints “Welcome ” + name?","<code>Welcome Amina</code>"],
["What does <code>addNumbers(10, 20)</code> print, if it prints “Sum = ” + (a + b)?","<code>Sum = 30</code>"],
["What does the return statement do?","It sends a value back to the caller and ends the method. The return type must match the returned value."],
["What is printed? <code>int result = add(5, 3); System.out.println(result);</code>","<code>8</code>: add(5, 3) returns 8, which is stored in result and printed."],
["What does <code>calculateArea(5, 4)</code> return if it computes length * width?","<code>20</code>, so the program prints <code>Area = 20</code>."],
["Trace: <code>multiply(int x, int y) { return x * y; }</code> and <code>int answer = multiply(4, 6);</code>","Parameters: x, y. Arguments: 4, 6. Returned value: 24. Printed: <code>24</code>."],
["What is the difference between a void method and a value-returning method?","A void method performs an action without returning anything (<code>display()</code>); a value-returning method returns a value (<code>square(4)</code> returns 16)."],
["Why is <code>sayHello()</code> able to run from main()?","Java starts execution from <code>main()</code>; calling <code>sayHello();</code> runs the statements inside that method. It is static, so it can be called from static main."],
["Give four good practices for writing methods.","Use meaningful camelCase names starting with a lowercase letter; declare methods inside a class (not inside another method); keep each method focused on one task; match argument types and order with the parameters."]
]}
];
const nav=document.getElementById("nav"),main=document.getElementById("main");
D.forEach((ch,i)=>{
  const id="ch"+(i+1);
  nav.insertAdjacentHTML("beforeend",`<a class="${ch.c}" href="#${id}">Chapter ${i+1}</a>`);
  main.insertAdjacentHTML("beforeend",`<section id="${id}" class="${ch.c}"><div class="wrap">
    <div class="head"><div><h2>${ch.t}</h2><small>${ch.s} · ${ch.qa.length} sual</small></div>
    <button type="button" data-open="0">Tus dhammaan jawaabaha</button></div>
    <div class="qs">${ch.qa.map(([q,a])=>`<details><summary>${q}</summary><div class="ans">${a}</div></details>`).join("")}</div></div></section>`);
});
main.addEventListener("click",e=>{
  const b=e.target.closest("button[data-open]"); if(!b) return;
  const open=b.dataset.open==="0";
  b.closest("section").querySelectorAll("details").forEach(d=>d.open=open);
  b.dataset.open=open?"1":"0";
  b.textContent=open?"Qari dhammaan jawaabaha":"Tus dhammaan jawaabaha";
});
function show(){
  let id=location.hash.slice(1); if(!/^ch[1-4]$/.test(id)) id="ch1";
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id));
  window.scrollTo(0,0);
}
addEventListener("hashchange",show);show();
</script>
</body>
</html>
