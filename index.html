<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Software Research – Sual iyo Jawaab</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b1f2a;--muted:#5b6475;--border:#dde2ee;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#eef0f6;--muted:#a3adc0;--border:#2d3445;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#eef0f6;--muted:#a3adc0;--border:#2d3445;color-scheme:dark}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{text-align:center;padding:36px 16px 20px}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,36px)}
header p{margin:0;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;background:var(--a)}
nav a{opacity:.55}nav a.on{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 35%,transparent)}
section{display:none}section.on{display:block}
.c1{--a:#d9480f}.c2{--a:#0f766e}.c3{--a:#7c3aed}.c4{--a:#2563eb}
section{background:color-mix(in srgb,var(--a) 10%,var(--bg));border-top:6px solid var(--a);padding:28px 16px 36px}
.wrap{max-width:820px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.head h2{margin:0;font-size:22px;color:var(--a)}
.head small{display:block;color:var(--muted);font-size:14px}
button{font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--a);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
details{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--a);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"Q" counter(q);counter-increment:q;color:var(--a);margin-right:8px;font-weight:800}
.qs{counter-reset:q}
details[open] summary{border-bottom:1px dashed var(--border)}
.ans{padding:12px 14px;color:var(--text)}
.ans::before{content:"Jawaab: ";color:var(--a);font-weight:700}
code{background:color-mix(in srgb,var(--a) 14%,var(--card));padding:1px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:.92em}

.quiz{margin-top:30px;padding-top:20px;border-top:2px dashed var(--a)}
.quiz h3{margin:0;font-size:20px;color:var(--a)}
.mq{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.mq p{margin:0 0 6px}
.op{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;color:var(--text);font-weight:500;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px}
.op .ci{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--a);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--a)}
.op:hover{background:color-mix(in srgb,var(--a) 10%,var(--card))}
.mq.done .op{cursor:default}
.op.ok{background:color-mix(in srgb,#16a34a 18%,var(--card));border-color:#16a34a}
.op.ok .ci{background:#16a34a;border-color:#16a34a;color:#fff}
.op.no{background:color-mix(in srgb,#dc2626 16%,var(--card));border-color:#dc2626}
.op.no .ci{background:#dc2626;border-color:#dc2626;color:#fff}
footer{text-align:center;color:var(--muted);padding:20px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🔬 Software Research – Sual iyo Jawaab</h1>
  <p>Software Research Methods · 3 chapter · guji sual kasta si aad jawaabta u aragto</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>Waxaa laga sameeyay slides-ka Software Research · Guul!</footer>
<script>
const D=[
{c:"c1",n:"Chapter 1",t:"Chapter 1: Introduction to Software Research",s:"Meaning, characteristics, purposes, process, types of research",qa:[
["What is research?","A systematic, organized and objective process of collecting, analyzing and interpreting information to answer questions, solve problems, discover new knowledge or verify existing knowledge. It is a careful and systematic investigation, not just searching the internet."],
["What is the difference between research and simple information searching?","Searching may be informal, use a few sources, need no data collection or methodology and answers a simple question. Research is systematic and planned, examines evidence and literature, often collects and analyzes data, investigates a research problem, uses a methodology and can generate new knowledge. Example: Googling “What is cloud computing?” is searching; “An investigation of the factors affecting cloud-computing adoption among university students” is research."],
["Name the key characteristics of research.","<b>Systematic</b> (Problem → Questions → Literature Review → Methodology → Data Collection → Analysis → Conclusion); <b>Objective</b> (based on evidence, not opinions); <b>Empirical</b> (observable, measurable evidence); <b>Logical</b> (conclusions follow the evidence); <b>Controlled</b> (e.g. experimental vs control group); <b>Critical</b> (question reliability of sources, sample, limitations, other explanations)."],
["What are the six main purposes of research? Give an example of each.","Discover new knowledge (new machine-learning technique for fraud detection); solve problems (why an online registration system fails); describe a situation (% of students using AI tools); explain relationships (internet access and use of online resources); evaluate (did a new e-learning system improve access?); predict (use historical data to identify students needing support)."],
["Define research problem, research question, research objective and hypothesis.","Research problem: an issue that requires investigation. Research question: a specific question the study tries to answer. Research objective: what the researcher intends to achieve. Hypothesis: a testable statement about a possible relationship between variables."],
["Define literature review, methodology, data, population, sample, variable, analysis, findings, conclusion and recommendation.","Literature review: examination of previous research. Methodology: overall approach and methods. Data: information collected. Population: the entire relevant group. Sample: a selected portion of the population. Variable: a factor that can take different values. Analysis: examining data for patterns. Findings: results from the analysis. Conclusion: overall interpretation. Recommendation: suggested actions based on the findings."],
["List the steps of the research process.","1) Identify the problem, 2) Develop research questions, 3) Set objectives, 4) Review literature, 5) Develop methodology, 6) Collect data, 7) Analyze data, 8) Interpret findings, 9) Draw conclusions, 10) Make recommendations and report results. The exact process can vary with the design and discipline."],
["Give an example of a software research project (online learning system).","Problem: students have difficulties using the online learning system. Question: what factors affect students’ satisfaction? Objective: identify those factors. Data: questionnaires, interviews, system usage records, observation. Independent variables: usability, internet accessibility, response time, technical support. Dependent variable: student satisfaction. Then analyze, conclude and recommend improvements."],
["Why is research important, and where is it used in academic study?","It helps discover knowledge, solve problems, make evidence-based decisions, improve products and services, test theories, develop technologies, evaluate programs and identify causes. In universities: assignments, research papers, final-year projects, bachelor’s theses, master’s and doctoral dissertations, and journal publications."],
["Give an example of a research study and its steps.","“Does social media affect students’ academic performance?” The researcher identifies the problem, develops questions, reviews previous research, selects students, prepares questionnaires or interviews, collects data, analyzes data, interprets findings, draws conclusions and makes recommendations."],
["How can we use research to gain new knowledge?","By categorizing (grouping by shared characteristics), describing (answering “What?”), comparing (similarities and differences of cases), correlation (relationships between two phenomena), prediction (forecasting with data analysis, machine learning and statistical models, using if–then statements) and control/experimental (testing cause and effect between independent and dependent variables)."],
["What is software engineering, and why do research in it?","Software engineering is the engineering branch for developing software products using well-defined scientific principles, methods and procedures (planning, design, development and maintenance). Software is everywhere but increasing complexity brings delays, defects and vulnerabilities, so research is needed to build trustworthy, adaptable software."],
["Name research areas in software engineering.","Software development methodologies (Waterfall, Agile, Spiral, RAD; no single one is best for all situations); Software Quality Assurance (testing for errors, meeting customer requirements, ISO 9000); Software maintenance and evolution (challenges: budget, new technologies like cloud and mobile, poorly documented legacy code)."],
["What are empirical and applied research?","<b>Empirical</b>: based on collecting and analyzing real-world data (quantitative and qualitative), e.g. “Factors Affecting Software Project Failure in Small Software Companies”. <b>Applied</b>: answers a specific question and solves a practical problem, often with researchers and stakeholders in cycles of planning, action, reflection and adjustment, e.g. “Design and Implementation of an Online University Admission System”."],
["What are descriptive and experimental research?","<b>Descriptive</b>: describes the behaviour of a sample population (the “what”), using observations, surveys and case studies, e.g. “A Study of Factors Affecting Software Quality in Software Development Practice”. <b>Experimental</b>: determines how and why something happens by changing an independent variable and observing its effect on a dependent variable (cause and effect), often in a controlled environment, e.g. drug trials."]
]},
{c:"c2",n:"Chapter 2",t:"Chapter 2: Software Research Concepts",s:"Concepts, variables, constructs, relationships and research models",qa:[
["Which five fundamental elements must be understood in software research?","Concepts, variables, constructs, relationships and research models. They help move from a general research idea to a structured, testable study."],
["What is a concept? Give examples.","A general idea, phenomenon or abstract notion that the researcher wants to study. Examples: software quality, user satisfaction, usability, system performance, security, developer productivity, AI, maintainability, user experience, Agile development. Concepts are abstract, hard to measure directly, and are converted into measurable variables or constructs."],
["What is a variable? Give examples of values.","A measurable characteristic that can take different values and can be measured, observed, categorized or manipulated. Examples: age (18, 20, 25), programming experience (Beginner, Intermediate, Advanced), response time (1, 2, 5 sec), satisfaction (Low, Medium, High), number of defects, development time."],
["What is an independent variable?","A variable expected to influence or cause changes in another variable. Example: in “The effect of Agile practices on software development productivity”, the IV is Agile practices (Daily Scrum, sprint planning, continuous integration, retrospectives)."],
["What is a dependent variable?","The outcome that the researcher measures. In the same example, software development productivity is the DV: Agile Practices → Software Development Productivity."],
["What is a construct?","An abstract theoretical concept that usually cannot be measured directly but can be measured through several observable indicators. It is especially important in software engineering and information-systems research."],
["How can you measure the construct “user satisfaction”?","With indicator statements such as “I am satisfied with the system”, “The system meets my expectations”, “I would recommend the system to others” and “I would use the system again”."],
["Give the indicators for the construct “software usability”.","Ease of learning, ease of use, efficiency, error frequency and user-interface simplicity. So: Software Usability → Indicators → Questionnaire responses."],
["Explain the difference between concept, construct, variable, indicator and value.","Concept: general idea (software quality). Construct: abstract concept defined theoretically (user satisfaction). Variable: measurable characteristic (satisfaction score). Indicator: observable measure of a construct (“The system is easy to use”). Value: actual measurement result (4 out of 5)."],
["How can you remember these terms simply?","Concept = what are you interested in? Construct = what theoretical idea are you studying? Variable = what can you measure? Indicator = how do you measure it?"],
["What is a relationship in research? Name its types.","How two or more variables or constructs are connected (influences, predicts, is associated with, has a positive or negative effect). <b>Positive</b>: both increase (training ↑ → productivity ↑). <b>Negative</b>: one increases, the other decreases (defects ↑ → quality ↓). <b>No relationship</b>: developer age and internet connection speed."],
["What is a research model?","A conceptual representation (usually a diagram) of the important variables or constructs and the relationships between them, showing how the researcher believes they are connected. Example: Software Usability (IV) → User Satisfaction (DV); the arrow shows the proposed relationship."],
["What is a mediating variable? Give an example.","A variable that sits between the IV and the DV and carries the effect. Example: Agile Practices (IV) → Team Collaboration (mediating variable) → Software Development Performance (DV)."],
["Give an example of a model with many independent variables.","Topic: “Factors Affecting the Success of University Software Projects”. IVs: requirements management, developer skills, project management, user involvement, software testing. DV: software project success. All the factors point with arrows to project success."],
["Describe the path from a research problem to a research model.","Research problem → research questions → identify concepts → identify constructs → identify variables → define relationships → develop the research model → develop hypotheses → collect data → analyze data → draw conclusions."]
]},
{c:"c3",n:"Chapter 3",t:"Chapter 3: Software Research Proposal Development",s:"Project proposals, benefits, tips, elements and requirements",qa:[
["What is a project proposal?","A detailed description of a series of activities aimed at solving a certain problem. It contains the ideas, aims and purpose of a specific project to inform the board or management of a company. Writing one is challenging because it is customer-centric."],
["What is the purpose of a project proposal?","To inform relevant parties about the plans and proposed operations of a project and convince them to accept it. Proposals are essential for securing funds and sponsorships, gaining new and keeping old clients, and convincing the board to release funds."],
["How does the proposal process work in industry?","In projects for external clients the customer gives a brief or terms of reference and the project manager replies with a proposal. Software organizations often prepare a proposal hoping to win a contract with an organization or the government. Much project planning is done during proposal writing, so it must be clear, thorough and targeted."],
["Name the benefits of a good project proposal.","Builds initiative (gives investors and management confidence); helps the project stay focused (due process, stakeholders can check it delivers as promised); anticipates and solves problems early (risks and challenges are discussed); aids planning (including delegation of roles)."],
["Give tips for writing an effective proposal.","Write for your audience (use terms that resonate with them) and be persuasive (use survey results, market predictions, testimonials, case studies and relevant experience)."],
["What detailed explanations should a proposal contain?","Justification (title, names and places, goals and objectives); activities and implementation timelines (technologies, schedule, resources); methodology (methods and techniques); and human, material and financial resources required (manpower, finance and other resources)."],
["Describe elements 2.1 and 2.2 of a proposal.","2.1 Project title: title, place and date of preparation, lead organization and the donor agency addressed. 2.2 Goals and objectives: business benefits in cost and schedule, defined carefully to improve estimation accuracy."],
["Describe elements 2.3, 2.4 and 2.5.","2.3 Description of project activities: problem statement, objective, implementing organizations, key activities, resource allocation to employees and total budget. 2.4 Expected results: future outcomes of the inputs estimated in advance. 2.5 Implementation plan: planned deployment, installation and implementation approach, phased or “instant-on”."],
["What is the difference between a phased approach and an “instant-on” approach?","The implementation plan states whether the system will be implemented step by step in phases (phased approach) or switched on completely at once (“instant-on” approach)."],
["Describe elements 2.6 and 2.7.","2.6 Resources allocation: people, money, equipment and materials allocated according to phases. 2.7 Project personnel: the details of manpower according to tasks."],
["Describe elements 2.8, 2.9 and 2.10.","2.8 Detailed project budget: income, expenditure, direct and indirect costs. 2.9 Other technical means: other technology support according to the type of project. 2.10 Division of financial resources: financial sources divided by techniques, tools and tasks."],
["What are software and hardware requirements?","Also called Basic System Requirements: the minimum specifications needed so that the software runs smoothly and does not overwork the computer’s hardware."],
["What is the key decision when writing a proposal?","The structure of the proposal (its content and length). The structure depends on the nature of the project and on the funding agency’s requirements."]
]}
];
const nav=document.getElementById("nav"),main=document.getElementById("main");
D.forEach((ch,i)=>{
  const id="ch"+(i+1);
  nav.insertAdjacentHTML("beforeend",`<a class="${ch.c}" href="#${id}">${ch.n}</a>`);
  main.insertAdjacentHTML("beforeend",`<section id="${id}" class="${ch.c}"><div class="wrap">
    <div class="head"><div><h2>${ch.t}</h2><small>${ch.s} · ${ch.qa.length} sual</small></div>
    <button type="button" data-open="0">Tus dhammaan jawaabaha</button></div>
    <div class="qs">${ch.qa.map(([q,a])=>`<details><summary>${q}</summary><div class="ans">${a}</div></details>`).join("")}</div></div></section>`);
});
main.addEventListener("click",e=>{
  const b=e.target.closest("button[data-open]"); if(!b) return;
  const open=b.dataset.open==="0";
  b.closest("section").querySelectorAll("details").forEach(d=>d.open=open);
  b.dataset.open=open?"1":"0";
  b.textContent=open?"Qari dhammaan jawaabaha":"Tus dhammaan jawaabaha";
});
const M=[
[["Research is best described as…",["random searching","a systematic, organized and objective process","only reading books","personal opinion"],1],
 ["A hypothesis is…",["a testable statement about a relationship between variables","a list of sources","the final conclusion","the entire study group"],0],
 ["The entire group relevant to a study is the…",["sample","population","variable","finding"],1],
 ["Which one is research, not simple information searching?",["Googling “What is cloud computing?”","Studying factors affecting cloud-computing adoption among students","Reading a blog post","Watching a video"],1],
 ["Experimental research tests how a(n) ______ variable affects a(n) ______ variable.",["dependent, independent","independent, dependent","control, sample","sample, population"],1]],
[["A variable expected to influence another variable is…",["dependent","independent","mediating","an indicator"],1],
 ["In “Agile Practices → Productivity”, productivity is the…",["independent variable","dependent variable","mediating variable","concept only"],1],
 ["An observable measure of a construct is a(n)…",["concept","indicator","value","model"],1],
 ["Defects ↑ → Quality ↓ is a…",["positive relationship","negative relationship","no relationship","mediating variable"],1],
 ["In “Agile → Team Collaboration → Performance”, collaboration is the…",["independent variable","dependent variable","mediating variable","concept"],2]],
[["The main purpose of a project proposal is to…",["inform and convince","confuse the client","write the code","test the software"],0],
 ["Which one is NOT a benefit of a good proposal?",["Builds initiative","Helps the project stay focused","Anticipates problems early","Guarantees no costs"],3],
 ["Which implementation approaches does a plan mention?",["Phased or instant-on","Only phased","Only waterfall","Only agile"],0],
 ["Basic System Requirements are…",["maximum specifications","the minimum specifications for smooth running","a price list","a user manual"],1],
 ["“Detailed project budget” describes…",["income, expenditure and direct/indirect costs","only the title","only the users","only the timeline"],0]]
]
;

document.querySelectorAll("section").forEach((s,i)=>{
  const L=M[i]; if(!L) return;
  const z=document.createElement("div"); z.className="quiz";
  z.innerHTML=`<div class="head"><div><h3>✏️ Dooro jawaabta saxda ah</h3><small>Guji goobadda (circle) jawaabta saxda ah · Dhibco: <b class="sc">0/${L.length}</b></small></div><button type="button" class="rs">Dib u bilow</button></div>`+
  L.map((x,k)=>`<div class="mq" data-a="${x[2]}"><p><b>${k+1}.</b> ${x[0]}</p>${x[1].map((o,j)=>`<button type="button" class="op" data-j="${j}"><span class="ci">${"ABCD"[j]}</span><span>${o}</span></button>`).join("")}</div>`).join("");
  s.querySelector(".wrap").appendChild(z);
});
function upd(z){z.querySelector(".sc").textContent=z.querySelectorAll(".mq.right").length+"/"+z.querySelectorAll(".mq").length}
document.addEventListener("click",e=>{
  const o=e.target.closest(".op"), r=e.target.closest(".rs");
  if(o){const q=o.closest(".mq"); if(q.classList.contains("done")) return;
    q.classList.add("done"); const a=+q.dataset.a;
    q.querySelectorAll(".op").forEach((b,j)=>{if(j===a)b.classList.add("ok"); else if(b===o)b.classList.add("no");});
    if(+o.dataset.j===a) q.classList.add("right"); upd(q.closest(".quiz"));}
  if(r){const z=r.closest(".quiz"); z.querySelectorAll(".mq").forEach(q=>{q.className="mq";q.querySelectorAll(".op").forEach(b=>b.className="op")}); upd(z);}
});
function show(){
  let id=location.hash.slice(1); if(!/^ch[1-3]$/.test(id)) id="ch1";
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id));
  window.scrollTo(0,0);
}
addEventListener("hashchange",show);show();
</script>
</body>
</html>
